<!-- Animated SVG icon library for Starlight Express
     Each icon is wrapped in <symbol> for reuse via <use href="#icon-name"> -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none;" aria-hidden="true">

  <!-- Cargo Plane -->
  <symbol id="icon-plane" viewBox="0 0 64 64">
    <g class="anim-plane">
      <path d="M8 32 L52 18 L56 22 L48 28 L52 36 L48 40 L42 36 L24 44 L20 40 L26 32 L20 30 L14 36 L10 34 L14 28 Z" fill="currentColor"/>
      <circle class="anim-dot" cx="40" cy="48" r="1.5" fill="currentColor" opacity="0.4"/>
      <circle class="anim-dot" cx="32" cy="50" r="1" fill="currentColor" opacity="0.3"/>
      <circle class="anim-dot" cx="24" cy="52" r="0.8" fill="currentColor" opacity="0.2"/>
    </g>
  </symbol>

  <!-- Cargo Box -->
  <symbol id="icon-box" viewBox="0 0 64 64">
    <g class="anim-box">
      <path d="M32 8 L56 20 L56 44 L32 56 L8 44 L8 20 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M8 20 L32 32 L56 20" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M32 32 L32 56" stroke="currentColor" stroke-width="2.5"/>
      <path class="anim-tape" d="M20 14 L20 38" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 2" opacity="0.6"/>
    </g>
  </symbol>

  <!-- Globe / Network -->
  <symbol id="icon-globe" viewBox="0 0 64 64">
    <g class="anim-globe">
      <circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <ellipse cx="32" cy="32" rx="10" ry="24" fill="none" stroke="currentColor" stroke-width="2"/>
      <ellipse cx="32" cy="32" rx="24" ry="10" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M8 32 L56 32" stroke="currentColor" stroke-width="2"/>
      <circle class="anim-pin" cx="44" cy="20" r="2.5" fill="currentColor"/>
    </g>
  </symbol>

  <!-- Chart / Analytics -->
  <symbol id="icon-chart" viewBox="0 0 64 64">
    <g class="anim-chart">
      <path d="M8 56 L56 56" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <path d="M8 56 L8 8" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      <rect class="anim-bar bar-1" x="16" y="40" width="6" height="14" fill="currentColor" rx="1"/>
      <rect class="anim-bar bar-2" x="28" y="28" width="6" height="26" fill="currentColor" rx="1"/>
      <rect class="anim-bar bar-3" x="40" y="20" width="6" height="34" fill="currentColor" rx="1"/>
      <path class="anim-trend" d="M14 38 L31 26 L46 18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.5"/>
    </g>
  </symbol>

  <!-- Shield (compliance) -->
  <symbol id="icon-shield" viewBox="0 0 64 64">
    <g class="anim-shield">
      <path d="M32 8 L52 16 L52 32 C52 44 42 52 32 56 C22 52 12 44 12 32 L12 16 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path class="anim-check" d="M22 32 L28 38 L42 24" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </symbol>

  <!-- Handshake -->
  <symbol id="icon-handshake" viewBox="0 0 64 64">
    <g class="anim-handshake">
      <path d="M8 28 L20 22 L28 28 L36 24 L44 28 L56 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M8 38 L20 32 L28 38 L36 34 L44 38 L56 34" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
      <circle cx="32" cy="32" r="4" fill="currentColor"/>
    </g>
  </symbol>

  <!-- Radar / Tracking -->
  <symbol id="icon-radar" viewBox="0 0 64 64">
    <g class="anim-radar">
      <circle cx="32" cy="32" r="24" fill="none" stroke="currentColor" stroke-width="2" opacity="0.3"/>
      <circle cx="32" cy="32" r="16" fill="none" stroke="currentColor" stroke-width="2" opacity="0.4"/>
      <circle cx="32" cy="32" r="8" fill="none" stroke="currentColor" stroke-width="2" opacity="0.5"/>
      <circle cx="32" cy="32" r="2" fill="currentColor"/>
      <path class="anim-sweep" d="M32 32 L32 8 A24 24 0 0 1 53 22 Z" fill="currentColor" opacity="0.25"/>
    </g>
  </symbol>

  <!-- Temperature / Cold chain -->
  <symbol id="icon-temp" viewBox="0 0 64 64">
    <g class="anim-temp">
      <rect x="26" y="8" width="12" height="36" rx="6" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="32" cy="50" r="8" fill="currentColor"/>
      <path class="anim-mercury" d="M32 50 L32 24" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <path d="M44 14 L48 14 M44 24 L48 24 M44 34 L48 34" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </symbol>

  <!-- Document / Compliance -->
  <symbol id="icon-document" viewBox="0 0 64 64">
    <g class="anim-document">
      <path d="M14 8 L40 8 L52 20 L52 56 L14 56 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M40 8 L40 20 L52 20" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path class="anim-line line-1" d="M22 30 L42 30" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="anim-line line-2" d="M22 38 L42 38" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="anim-line line-3" d="M22 46 L34 46" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </g>
  </symbol>

  <!-- Speech / Marketing -->
  <symbol id="icon-megaphone" viewBox="0 0 64 64">
    <g class="anim-megaphone">
      <path d="M12 24 L12 40 L24 40 L44 52 L44 12 L24 24 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M24 24 L24 40" stroke="currentColor" stroke-width="2.5"/>
      <path class="anim-wave wave-1" d="M48 22 Q54 32 48 42" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <path class="anim-wave wave-2" d="M52 18 Q60 32 52 46" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
    </g>
  </symbol>

  <!-- Diamond (high-value) -->
  <symbol id="icon-diamond" viewBox="0 0 64 64">
    <g class="anim-diamond">
      <path d="M16 24 L32 8 L48 24 L32 56 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M16 24 L48 24 M32 8 L32 24 M24 24 L32 56 M40 24 L32 56" stroke="currentColor" stroke-width="1.5"/>
      <circle class="anim-sparkle" cx="22" cy="18" r="1.5" fill="currentColor"/>
    </g>
  </symbol>

  <!-- Warning (DG) -->
  <symbol id="icon-warning" viewBox="0 0 64 64">
    <g class="anim-warning">
      <path d="M32 8 L56 52 L8 52 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path class="anim-exclaim" d="M32 24 L32 38" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
      <circle cx="32" cy="44" r="2" fill="currentColor"/>
    </g>
  </symbol>

  <!-- Leaf (perishables) -->
  <symbol id="icon-leaf" viewBox="0 0 64 64">
    <g class="anim-leaf">
      <path d="M48 8 C48 8 16 8 16 36 C16 48 24 56 36 56 C56 56 56 24 48 8 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M16 56 Q32 40 48 8" fill="none" stroke="currentColor" stroke-width="2"/>
    </g>
  </symbol>

  <!-- Pill (pharma) -->
  <symbol id="icon-pill" viewBox="0 0 64 64">
    <g class="anim-pill">
      <rect x="8" y="22" width="48" height="20" rx="10" fill="none" stroke="currentColor" stroke-width="2.5"/>
      <path d="M32 22 L32 42" stroke="currentColor" stroke-width="2.5"/>
      <circle cx="20" cy="32" r="1.5" fill="currentColor" opacity="0.5"/>
    </g>
  </symbol>

  <!-- Building / Office -->
  <symbol id="icon-building" viewBox="0 0 64 64">
    <g class="anim-building">
      <path d="M12 56 L12 16 L52 16 L52 56 Z" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M12 16 L32 4 L52 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="20" y="26" width="6" height="8" fill="currentColor"/>
      <rect x="29" y="26" width="6" height="8" fill="currentColor"/>
      <rect x="38" y="26" width="6" height="8" fill="currentColor"/>
      <rect x="20" y="40" width="6" height="8" fill="currentColor"/>
      <rect x="29" y="40" width="6" height="14" fill="currentColor"/>
      <rect x="38" y="40" width="6" height="8" fill="currentColor"/>
    </g>
  </symbol>

</svg>
